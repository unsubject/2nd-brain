name: CI

# Pull-request and main-branch checks for both packages. The DB-backed
# suites (mcp-worker/test/db, root test/*.test.ts: idea sweeper, MCP retention) run against a
# throwaway Postgres + pgvector service; the mcp-worker test setup resets
# and migrates it, then the root tests reuse the migrated database.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Build (root)
        run: npm run build

      - name: Install (mcp-worker)
        working-directory: mcp-worker
        run: npm install --no-audit --no-fund

      - name: Typecheck (mcp-worker)
        working-directory: mcp-worker
        run: npm run typecheck

      - name: Test (mcp-worker)
        working-directory: mcp-worker
        run: npm test -- --run

      - name: Test (root)
        run: npm test

  legal-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: legal-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # wrangler 4 needs Node 22+.
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      # Validates wrangler.jsonc, routes, _headers and _redirects without
      # deploying (no Cloudflare credentials needed).
      - name: Check
        run: npm run check
