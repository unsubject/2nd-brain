<style>

  .site-header { border-bottom: 1px solid var(--rule); font-family: var(--sans); }

  .site-header nav a { color: var(--muted); text-decoration: none; }
  .site-header nav a:hover { color: var(--text); }
  .site-header nav a[aria-current="page"] { color: var(--text); font-weight: 600; }
  main.wrap { padding-top: 2.5rem; padding-bottom: 3rem; }
  h1, h2, h3 { font-family: var(--sans); line-height: 1.25; }
  h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.25rem; margin: 2.5rem 0 0.75rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
  h3 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; }
  .meta { font-family: var(--sans); color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .lede { font-size: 1.125rem; }
  p, ul, ol { margin: 0 0 1rem; }
  li { margin-bottom: 0.4rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1.25rem 1.25rem 0.5rem;
    margin: 1.75rem 0;
  }
  .card h2 { margin: 0 0 0.75rem; padding: 0; border: 0; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .toc ol { font-family: var(--sans); font-size: 0.95rem; columns: 2 16rem; column-gap: 2rem; padding-left: 1.75rem; }
  .toc li { break-inside: avoid; }
  .note { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 0.9rem 1rem; border-radius: 0 8px 8px 0; margin: 1.25rem 0; }
  .note p:last-child { margin-bottom: 0; }
  .caps { font-size: 0.95rem; letter-spacing: 0.01em; }
  .site-footer { border-top: 1px solid var(--rule); font-family: var(--sans); font-size: 0.875rem; color: var(--muted); }
  .site-footer .wrap { padding-top: 1.5rem; padding-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
  .site-footer a { color: var(--muted); }
  @media print {
    :root { --bg: #fff; --surface: #fff; --text: #000; --muted: #333; --rule: #bbb; --accent: #000; --accent-soft: #fff; }
    .site-header nav, .toc, .site-footer { display: none; }
    a { text-decoration: none; }
    h2 { break-after: avoid; }
  }
</style>
